spring.application.name=SubTrack

ai.max-output-tokens=8000
ai.max-retries=3

ai.main-provider.provider=mistral
ai.main-provider.model-name=open-mistral-nemo
ai.main-provider.api-key=BUCZCVbuY0dxcKCt8YyI37jOoRL4lNdM

ai.backup-provider.provider=gemini
ai.backup-provider.model-name=gemini-3.1-flash-lite
ai.backup-provider.api-key=${GEMINI_API_KEY}

spring.datasource.url=jdbc:postgresql://localhost:5432/subtrack
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true